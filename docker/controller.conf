{
  "controller": {
    "listen": ":19090",
    "etcd": "http://127.0.0.1:2379",
    "etcdPrefix": "/sdn/controller/v1",
    "insecure": true
  },
  "etcd": {
    "enabled": true,
    "name": "sdn-docker",
    "clientPort": 2379,
    "peerPort": 2380,
    "dataDir": "/etcd-data",
    "startupTimeoutSeconds": 30,
    "shutdownTimeoutSeconds": 20
  }
}
